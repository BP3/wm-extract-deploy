# Coverage of WMED's Python code when the integration tests run it from the checkout
# (WMED_RUN=local WMED_COVERAGE=true). test-runner.sh sets WMED_COVERAGE_DIR, and so does the CI job that reports
# coverage (measure-coverage in .github/workflows/branch-build.yaml).

[run]
data_file = ${WMED_COVERAGE_DIR}/.coverage
parallel = true

[report]
show_missing = true
skip_empty = true

[html]
directory = ${WMED_COVERAGE_DIR}/html

[xml]
output = ${WMED_COVERAGE_DIR}/coverage.xml
