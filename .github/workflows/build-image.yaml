name: Build image

on:
  workflow_call:
    inputs:
      username:
        required: true
        type: string
      image-name:
        required: true
        type: string
      branch-name:
        required: true
        type: string
    outputs:
      image-tag:
        description: The tag the image was pushed with, made from the branch name
        value: ${{ jobs.build-image.outputs.image-tag }}

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.image-tag.outputs.image-tag }}
    steps:

      # Docker tags allow only letters, digits, '_', '.' and '-' (up to 128), so a branch such as
      # 'renovate/python-3.x' becomes 'renovate-python-3.x'. The branch name is passed in through env rather than
      # written into the script, so a crafted branch name can't inject shell commands
      - name: Make the image tag from the branch name
        id: image-tag
        env:
          BRANCH_NAME: ${{ inputs.branch-name }}
        run: |
          tag=$(printf '%s' "$BRANCH_NAME" | tr -c 'A-Za-z0-9_.-' '-' | cut -c 1-128)
          echo "branch-name = $BRANCH_NAME"
          echo "image-tag = $tag"
          echo "image-tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ inputs.username }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushing moves the branch's tag to the new image. The old one is left untagged, along with its platform and
      # attestation manifests, and clean-up-images.yaml deletes it later (#125)
      - name: Build Docker image of application, tag with branch name
        env:
          IMAGE: ${{ inputs.image-name }}:${{ steps.image-tag.outputs.image-tag }}
        run: |
          echo "image = $IMAGE"
          docker build -t "$IMAGE" .

      - name: Push to local registry
        env:
          IMAGE: ${{ inputs.image-name }}:${{ steps.image-tag.outputs.image-tag }}
        run: |
          docker push "$IMAGE"
